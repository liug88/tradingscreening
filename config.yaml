# Every threshold and weight the screener uses lives here.
# Edit this file to tune the screen -- you should not need to touch the code.

universe:
  refresh_days: 7          # re-download the CBOE weeklys list this often

# Fail any gate and the stock is dropped. These are the "can she actually
# trade it" filters -- not opinions about the stock.
gates:
  min_price: 10.0
  min_avg_volume_30d: 500000
  min_market_cap: 1000000000
  # Two-sided, because the setup is "oversold BUT bouncing" and one threshold
  # can only express half of it. Neither of these is an opinion about the stock.
  #
  # max_rsi_recent: it has to have actually been stretched inside the lookback.
  # Without this, names rank into the top ten on premium and yield alone while
  # failing the oversold thesis the whole strategy rests on.
  max_rsi_recent: 50
  # max_rsi: and it can't have already run away. A single "is it oversold today"
  # test can't do both jobs -- set at 50 it drops the bouncing half of the setup
  # (BE reclaimed its EMAs at RSI 49, one green day from exclusion); measured
  # only on the recent low it readmits stocks that ripped (ASST went 49 -> 83 in
  # ten sessions on a 10-day minimum of 48.9). This is the "hasn't run away yet"
  # ceiling, deliberately looser than the oversold bar above.
  max_rsi: 65

# Which put contract to suggest.
option:
  target_dte: 35
  # The window has to be wider than one monthly cycle (~35 days) or a stock with
  # monthly-only expiries can straddle it -- CROX had expiries at 23 and 51 days
  # and a 25-50 window excluded both.
  min_dte: 21
  max_dte: 56
  target_delta: 0.20       # ~80% chance of expiring worthless
  min_delta: 0.10
  max_delta: 0.35
  min_bid: 0.20            # below this the premium isn't worth the commission
  min_open_interest: 100
  max_spread_pct: 0.15     # (ask - bid) / mid -- wider than this won't fill well

# Which call contract to suggest, when she wants the upside instead of the
# income. Every number here was measured against eight live chains on
# 2026-08-28 rather than guessed, because a long-dated in-the-money board looks
# nothing like the 35-day put board the block above was tuned on.
#
#   spreads      2-8% on the liquid names, 15-58% on the thin ones
#   open int.    12 to 13,089 on the same six strikes -- the range is the point
#   time value   44% to 76% of the price at 0.65 delta, which is NOT small
#
# That last row matters and the page says so. The plan asked for 0.65 delta on
# the grounds that decay would be a small share of the position; on this
# universe it is not, because the screen deliberately selects high implied
# volatility and high IV is exactly what a buyer overpays for. The delta stays
# where it was -- deeper would cost the leverage the list is for -- and
# `time_value_share` is published on every row instead, so what she is paying
# for time is a figure on the screen rather than an assumption in a config file.
call:
  target_dte: 90           # a chart thesis needs longer than five weeks
  min_dte: 60
  max_dte: 135
  target_delta: 0.65       # in the money; the cheap OTM call is the one that expires worthless
  min_delta: 0.50
  max_delta: 0.80
  min_bid: 0.50
  # Looser than the put's 100 because the long-dated board is genuinely
  # thinner -- ASML's best contract carried 52 -- and the spread filter below
  # is doing the real liquidity work.
  min_open_interest: 50
  # Tighter than the put's 0.15, on purpose. A seller crosses the spread once
  # and lets the contract expire; a buyer crosses it going in and again coming
  # out. Measured, this keeps every liquid name and drops APLD (15-58%) and
  # AAL's two thinnest strikes.
  max_spread_pct: 0.12

# How many names survive each narrowing stage.
funnel:
  after_technicals: 150
  after_fundamentals: 75
  final: 10

# Must sum to 100.
weights:
  oversold: 20
  bounce: 15
  premium_richness: 20
  sales_growth: 15
  margin_trend: 10
  strike_safety: 10
  trade_quality: 10

# The same 62 names, ranked by a second question: what do I want to own, over
# two lengths of time. Three of the weights above read a contract and are absent
# here, because a stock is worth buying whether or not there is a put on it
# worth selling. A profile is just a block like these -- `score()` computes only
# the components its block names.

# Hold for weeks. The dip is the trade, so timing the entry is the biggest term.
weights_buy:
  entry_timing: 30
  trend_structure: 25
  revenue_expanding: 20
  room_to_run: 15
  margin_trend: 10

# Hold for months. Entry timing is left at zero deliberately: over six months
# today's RSI is noise, and if both horizons scored the dip they would be one
# list. It is listed rather than omitted so the slider still appears -- she can
# raise it if she disagrees, which is the whole point of the sliders.
weights_long:
  trend_structure: 35
  revenue_expanding: 35
  room_to_run: 15
  margin_trend: 15
  entry_timing: 0

scoring:
  rsi_ideal_low: 28        # full credit inside this band
  rsi_ideal_high: 38
  rsi_zero_above: 50       # no credit at or above this
  williams_r_oversold: -80
  # The other three readings in the oversold composite, each on the same 0-1
  # ramp as RSI: full credit at the value below, none at the midpoint. 20 is the
  # conventional oversold mark for both the stochastic and MFI; 0 is the lower
  # Bollinger band, which is a definition rather than a convention.
  stoch_oversold: 20
  mfi_oversold: 20
  bb_oversold: 0.0
  # Oversold is scaled by how much of `bounce` has confirmed, not added
  # alongside it. This is the credit a name keeps with no turn at all: enough
  # that a washout still registers, little enough that it cannot carry a
  # falling knife into the ten on cheapness alone.
  oversold_unconfirmed_floor: 0.35
  # A cross younger than this still has runway; older than this it is history.
  # One quarter, which is about how long the 50-day takes to matter.
  trend_cross_fresh_days: 60
  # Distance below the 52-week high, read as upside up to a point and as a
  # collapse past it: full credit at the first, none again by the second. The
  # second number is why RBLX, 74% down, scores zero room to run rather than
  # the maximum a single ramp would have handed it.
  room_ideal_below_high: 0.35
  room_broken_below_high: 0.70
  # What survives of that when the 50-day sits under the 200-day. The fall is
  # real; the recovery is not evidence yet.
  room_broken_trend_factor: 0.25
  rev_yoy_target: 0.10     # full credit at +10% YoY
  # And the other question about the same number, asked by the two rankings
  # built to hold a name: not "is it growing" but "how hard". Full credit at
  # +40% year on year, which is roughly where a business stops growing and
  # starts compounding.
  rev_yoy_strong: 0.40
  iv_hv_rich: 1.30         # full credit at or above -- premium is rich vs realized
  ann_yield_target: 0.20   # full credit at 20% annualized on cash secured

# Subtracted from the composite score.
penalties:
  earnings_before_expiry: 25
  iv_hv_extreme: 15        # IV/HV above the threshold below = binary event risk
  iv_hv_extreme_above: 2.50
  gap_down_5d: 15          # dropped more than gap_down_5d_pct in 5 sessions
  gap_down_5d_pct: 0.15
  new_low_under_ema200: 10
  # Measured against the low it is sitting on rather than a 3% band, so the
  # penalty covers the grind along the bottom and not just the day of the low.
  near_52w_low_pct: 0.15
  # Below the 200-day, the 50-day below it too, and no turn yet. The chart that
  # made her mother close the page.
  downtrend_confirmed: 20
  downtrend_bounce_max: 0.15   # "no turn": at most one weak bounce signal
  catalyst_structural: 30  # the AI layer judged the selloff structural

# What one ranking charges differently. Only the numbers that change: everything
# else falls through to the block above, so a rule keeps a single home.
#
# Holding for months, a name cutting new lows under a falling 200-day is not a
# discount, it is the exact opposite of the chart the ranking is built to find.
# It costs more here than anywhere else, and the confirmed downtrend stays the
# heavier of the two, as it is the worse condition.
penalties_long:
  downtrend_confirmed: 35
  new_low_under_ema200: 20

catalyst:
  # Gemini, on the free tier, grounded with Google Search. Flash rather
  # than Pro: the free tier's daily allowance is far larger on Flash, and this
  # is a summarising job over search results, not a reasoning one.
  model: gemini-3.7-flash

# How long each ranking's position is held, for the backtest. The put's window
# is the option's own life and is read from `option.target_dte` above rather
# than repeated here. Weeks for buy; six months for long, which is what makes
# it a different list rather than the same one at a different weight.
horizon_days:
  buy: 35
  long: 180
