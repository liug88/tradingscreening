# The chat lives here rather than in the Action so the morning pipeline stays
# exactly as it is: cron -> screen -> commit -> Pages. Nothing about this Worker
# can break the list she reads.

name = "put-screen-chat"
main = "src/index.js"
compatibility_date = "2026-08-26"

[vars]
# The only origin allowed to call this. The page is served from GitHub Pages,
# so the browser sends this exact origin and nothing else may.
ALLOWED_ORIGIN = "https://liug88.github.io"
DATA_URL = "https://liug88.github.io/tradingscreening/data/latest.json"

# Gemini, on the free tier. Change it here rather than in the code; the daily
# screen picks its own model in config.yaml, for the same reason.
MODEL = "gemini-3.7-flash"

# A stop that comes with a sentence, ahead of the one that comes with a 429.
# Google enforces the real daily limit; this exists so a stuck tab hits a line
# she can read instead of quietly eating the questions she meant to ask.
#
# The free tier allows 20 requests a day for this model, and the morning
# catalyst call shares the key: one request normally, three if it has to retry.
# Twelve leaves the worst morning covered and five spare, so her limit is
# always this readable one rather than Google's 429. Raise it here if the
# allowance goes up -- check AI Studio's rate-limits page for the real number.
DAILY_TURNS = "12"

# Created with:  npx wrangler kv namespace create COUNTER
# Paste the printed id here before the first deploy.
[[kv_namespaces]]
binding = "COUNTER"
id = "389f2b9136ea4ad8bccdc11aa738f097"

# Secrets, set once and never committed:
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put PASSPHRASE
