# The chat lives here rather than in the Action so the morning pipeline stays
# exactly as it is: cron -> screen -> commit -> Pages. Nothing about this Worker
# can break the list she reads.

name = "put-screen-chat"
main = "src/index.js"
compatibility_date = "2026-08-26"

[vars]
# The only origin allowed to call this. The page is served from GitHub Pages,
# so the browser sends this exact origin and nothing else may.
ALLOWED_ORIGIN = "https://liug88.github.io"
DATA_URL = "https://liug88.github.io/tradingscreening/data/latest.json"

# Gemini, on the free tier. Change it here rather than in the code; the daily
# screen picks its own model in config.yaml, for the same reason.
MODEL = "gemini-3.7-flash"

# Two stops that come with a sentence, ahead of the one that comes with a 429.
# Google enforces the real daily limit; these exist so a stuck tab, or a
# stranger who found the URL in this public repo, hits a line she can read
# instead of quietly eating the questions she meant to ask.
#
# DAILY_TURNS is the whole Worker's day. The free tier allows 20 requests a day
# for this model, counted from midnight Pacific, and the morning catalyst call
# shares the key -- but it goes out at 5:30 Pacific, first on a fresh day, and
# takes one request, or three if it has to retry. Sixteen leaves those three
# and one for the counter's own imprecision. Raise it here if the allowance
# goes up -- AI Studio's rate-limits page has the real number.
#
# VISITOR_TURNS is one visitor's share of that, keyed on the address. Alone,
# she has twelve; a stranger can take at most twelve of the sixteen, not all
# of them.
DAILY_TURNS = "16"
VISITOR_TURNS = "12"

# Created with:  npx wrangler kv namespace create COUNTER
# Paste the printed id here before the first deploy.
[[kv_namespaces]]
binding = "COUNTER"
id = "389f2b9136ea4ad8bccdc11aa738f097"

# Secret, set once and never committed:
#   npx wrangler secret put GEMINI_API_KEY
