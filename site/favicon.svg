<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The tally is the page's central motif: every quantity on it is counted
       rather than read. Blue field, reversed marks, zero radius, no depth:
       the same four rules the sheet itself follows. -->
  <rect width="32" height="32" fill="#15497A"/>
  <g stroke="#F7F9FA" stroke-width="3.4" stroke-linecap="butt">
    <path d="M8 7.5V24.5"/>
    <path d="M16 7.5V24.5"/>
    <path d="M24 7.5V24.5"/>
  </g>
</svg>
